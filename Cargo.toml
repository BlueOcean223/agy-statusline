[package]
name = "agy-ccline"
version = "0.2.0"
edition = "2024"
description = "Pure-Rust CCometixLine telemetry & native Auxiliary Pane sidecar for Google Antigravity"
license = "MIT"

[[bin]]
name = "agy-ccline"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
chrono = "0.4"
dirs = "6.0"
regex = "1.0"
clap = { version = "4.5", features = ["derive"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
