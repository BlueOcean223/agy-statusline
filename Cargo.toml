[package]
name = "agy-statusline"
version = "0.4.0"
edition = "2024"
description = "Statusline and telemetry side pane for Google Antigravity"
license = "MIT"

[[bin]]
name = "agy-statusline"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
chrono = "0.4"
dirs = "6.0"
regex = "1.0"
clap = { version = "4.5", features = ["derive"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
